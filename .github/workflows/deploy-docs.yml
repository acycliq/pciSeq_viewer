# Builds the GitHub Pages site from the desktop_app branch: the VitePress docs
# (served at the root) plus the web viewer (served under /web_viewer).
#
# The web viewer is the same page the desktop app shows. On the website it gets
# its data from a Google Cloud Storage bucket (src/web/webDataset.js) and not
# from Electron (src/web/webBackend.js).
#
# The master branch must not carry a copy of this workflow: a push there would
# publish master's old viewer over this one.
#
# One-time setup in the repo:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
name: Deploy docs

on:
  push:
    branches: [desktop_app]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
      # the files the web viewer is made of
      - 'index.html'
      - 'styles.css'
      - 'config.js'
      - 'src/**'
      - 'lib/**'
      - 'arrow-loader/**'
      - 'config/**'
      - 'utils/**'
      - 'voxel-viewer/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The docs and the web viewer both come from desktop_app.
      - name: Check out desktop_app
        uses: actions/checkout@v4
        with:
          ref: desktop_app

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build VitePress
        working-directory: website
        run: |
          npm ci
          npm run docs:build

      - name: Prepare combined deployment
        run: |
          mkdir -p deployment_payload/web_viewer

          # 1. VitePress documentation site at the root
          cp -r website/.vitepress/dist/* deployment_payload/

          # 2. Web viewer under /web_viewer: the page and the folders it loads
          #    from. Data is fetched from Google Cloud Storage at runtime, so no
          #    dataset files are bundled here.
          cp index.html styles.css config.js deployment_payload/web_viewer/
          cp -r src lib arrow-loader config utils voxel-viewer deployment_payload/web_viewer/

          # Add .nojekyll to prevent GitHub Pages from processing with Jekyll
          touch deployment_payload/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deployment_payload

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
